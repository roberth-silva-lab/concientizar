{emoji:"💗",kicker:"Conheça suas mamas",title:"Perceba mudanças no seu corpo",items:["Observe suas mamas no dia a dia, sem exigir técnica ou calendário fixo.","Procure avaliação profissional se notar qualquer alteração.","O autoexame não substitui mamografia ou consulta de saúde."]},
